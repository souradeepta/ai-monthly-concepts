<!doctype html><meta charset="utf-8"><title>Agent control loop</title>
<style>body{margin:0;background:#0b1220;color:#dbeafe;font:16px system-ui}.wrap{height:100vh;display:grid;place-items:center}.node{position:absolute;padding:20px;border-radius:12px;background:#172554;border:1px solid #60a5fa}.n1{transform:translate(-260px,-90px)}.n2{transform:translate(0,-90px);background:#78350f}.n3{transform:translate(260px,-90px);background:#14532d}.n4{transform:translate(0,120px)}.dot{width:18px;height:18px;border-radius:50%;background:#fbbf24;position:absolute;animation:loop 6s linear infinite}@keyframes loop{0%{transform:translate(-200px,-45px)}25%{transform:translate(50px,-45px)}50%{transform:translate(300px,-45px)}75%{transform:translate(50px,155px)}100%{transform:translate(-200px,-45px)}}.hint{position:fixed;bottom:24px;color:#94a3b8}</style>
<main class="wrap"><div class="node n1">Model proposal</div><div class="node n2">Policy gateway</div><div class="node n3">Bounded tool</div><div class="node n4">State + audit</div><div class="dot"></div><p class="hint">Animated teaching visual: propose → authorize → execute → observe</p></main>
